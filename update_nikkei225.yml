name: Update Nikkei 225 data

on:
  workflow_dispatch:
  schedule:
    # 07:45 UTC = 16:45 JST
    - cron: '45 7 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update data
        run: python update_nikkei225.py --data-dir data

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nikkei225_latest_3years.csv data/nikkei225_master.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update Nikkei 225 data"
          git push
