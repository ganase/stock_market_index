name: Update market data

on:
  workflow_dispatch:
  schedule:
    # 07:45 UTC = 16:45 JST
    - cron: '45 7 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4

      - name: Update Nikkei 225 index
        run: python scripts/update_nikkei225_index.py --repo-root .

      - name: Update Nikkei 225 current constituents
        run: python scripts/update_nikkei225_constituents.py --repo-root .

      - name: Update prices for current constituents
        run: python scripts/update_nikkei225_prices.py --repo-root .

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update market data"
          git push
