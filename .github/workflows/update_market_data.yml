name: Update market data

on:
  workflow_dispatch:
    inputs:
      publish_destination:
        description: "Publish destination for Tableau exports (local or google-drive)"
        required: false
        default: local
  schedule:
    # 07:45 UTC = 16:45 JST
    - cron: '45 7 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      PUBLISH_DESTINATION: ${{ github.event.inputs.publish_destination || 'local' }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth

      - name: Update Nikkei 225 index
        run: python scripts/update_nikkei225_index.py --repo-root .

      - name: Update prices from fixed constituents CSV
        run: python scripts/update_nikkei225_prices.py --repo-root . --price-provider stooq --sleep-seconds 0.35 --rate-limit-cooldown-seconds 180 --rate-limit-max-retries 1

      - name: Build Tableau exports locally
        if: ${{ !(((github.event_name == 'schedule') || env.PUBLISH_DESTINATION == 'google-drive') && env.GOOGLE_DRIVE_FOLDER_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 != '') }}
        run: python scripts/build_and_publish_tableau_feed.py --repo-root . --publish-destination local

      - name: Build Tableau exports and publish to Google Drive
        if: ${{ ((github.event_name == 'schedule') || env.PUBLISH_DESTINATION == 'google-drive') && env.GOOGLE_DRIVE_FOLDER_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        run: python scripts/build_and_publish_tableau_feed.py --repo-root . --publish-destination google-drive

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update market data"
          git push
